name: Release

# `main`'e her push'ta uygulamayı derler ve GitHub Releases'e yeni bir
# indirilebilir sürüm olarak ekler (hem .zip hem de çift tıklanabilir
# .pkg kurulum sihirbazı). `workflow_dispatch` elle de tetikleyebilmek
# için var.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini üret
        # Proje `app/` altında: depo üç ayrı ürüne bölündü
        # (uygulama / website / admin), bkz. mac_utils/README.md.
        working-directory: app
        run: xcodegen generate

      - name: Derle (imzasız)
        # CI runner'ında imzalama sertifikası yok — sertifika/notarization
        # kurulmadan tek yapılabilecek imzasız ("ad-hoc") derleme. Bu yüzden
        # App Group'a bağlı widget senkronizasyonu bu build'de çalışmaz;
        # tam imzalı/notarize dağıtım için ayrı bir Developer ID kurulumu
        # gerekir (bkz. scripts/make-pkg.sh, yerelde sertifika varsa imzalar).
        working-directory: app
        run: |
          xcodebuild \
            -project GlassDo.xcodeproj \
            -scheme GlassDo-macOS \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sürüm numarasını oku
        id: version
        run: |
          APP_PATH="app/build/Build/Products/Release/GlassDo-macOS.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Uygulamayı zip'le
        run: |
          cd app/build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            GlassDo-macOS.app "$GITHUB_WORKSPACE/GlassDo-macOS.zip"

      - name: .pkg kurulum paketi oluştur (imzasız)
        # `scripts/make-pkg.sh` ile aynı adımlar (pkgbuild + productbuild),
        # ama zaten yukarıda imzasız derlenmiş uygulamayı yeniden kullanıyor —
        # CI'da Developer ID sertifikası olmadığı için paket de imzasız
        # çıkıyor; yerel makinede sertifika varsa `scripts/make-pkg.sh`
        # onu bulup imzalıyor.
        run: |
          APP_PATH="app/build/Build/Products/Release/GlassDo-macOS.app"
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_ID="com.dadebay.GlassDo-macOS"
          STAGING="pkg-root"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/GlassDo.app"

          pkgbuild --root "$STAGING" \
            --identifier "$BUNDLE_ID" \
            --version "$VERSION" \
            --install-location "/Applications" \
            --scripts app/scripts/pkg-scripts \
            component.pkg

          cat > distribution.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
              <title>GlassDo $VERSION</title>
              <welcome file="welcome.html" mime-type="text/html"/>
              <conclusion file="conclusion.html" mime-type="text/html"/>
              <options customize="never" require-scripts="false" hostArchitectures="arm64,x86_64"/>
              <volume-check>
                  <allowed-os-versions><os-version min="26.0"/></allowed-os-versions>
              </volume-check>
              <pkg-ref id="$BUNDLE_ID"/>
              <choices-outline><line choice="default"/></choices-outline>
              <choice id="default" title="GlassDo"><pkg-ref id="$BUNDLE_ID"/></choice>
              <pkg-ref id="$BUNDLE_ID" version="$VERSION" onConclusion="none">component.pkg</pkg-ref>
          </installer-gui-script>
          XML

          # Sabit dosya adı: site "/releases/latest/download/GlassDo-macOS.pkg"
          # adresine doğrudan bağlanıyor, bu yüzden ad sürüm numarasıyla
          # değişmemeli (bkz. mac_utils_website/src/i18n/ui.ts).
          productbuild --distribution distribution.xml \
            --package-path . --resources app/Resources/pkg \
            "$GITHUB_WORKSPACE/GlassDo-macOS.pkg"

      - name: Release notu yaz
        run: |
          cat > "$GITHUB_WORKSPACE/notes.md" <<EOF
          Otomatik derleme — commit \`${GITHUB_SHA::7}\`.

          Bu build imzasız ve notarize edilmemiş: ilk açılışta Gatekeeper
          uyarı verir.

          - \`GlassDo-macOS.pkg\` (v${{ steps.version.outputs.version }}): çift
            tıkla, kurulum sihirbazını takip et.
          - \`GlassDo-macOS.zip\`: aç, Finder'da uygulamaya sağ tık → Aç ile geç.

          Terminalde de şunu çalıştırabilirsin:

          \`\`\`
          xattr -cr GlassDo-macOS.app
          \`\`\`
          EOF

      - name: Release yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/GlassDo-macOS.zip" \
            "$GITHUB_WORKSPACE/GlassDo-macOS.pkg" \
            --title "Build ${{ github.run_number }} (v${{ steps.version.outputs.version }})" \
            --notes-file "$GITHUB_WORKSPACE/notes.md"
